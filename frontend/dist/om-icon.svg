<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark background matching theme -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="52%">
      <stop offset="0%"   stop-color="#181308"/>
      <stop offset="65%"  stop-color="#0f0c05"/>
      <stop offset="100%" stop-color="#070603"/>
    </radialGradient>

    <!-- Warm bright golden gradient -->
    <linearGradient id="goldGradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#FFF8D1"/>
      <stop offset="25%"  stop-color="#FFDD55"/>
      <stop offset="60%"  stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#D47700"/>
    </linearGradient>

    <!-- Outer neon ring glow -->
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep warm golden drop shadow for 3D effect -->
    <filter id="omGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FFB800" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#FF8800" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Solid background -->
  <rect width="512" height="512" fill="#070603"/>
  <circle cx="256" cy="256" r="256" fill="url(#bgGlow)"/>

  <!-- Glowing outer circular golden ring -->
  <!-- Outer ring radius 215 keeps plenty of margin inside 256 for PWA maskable squircle/circle icons -->
  <circle cx="256" cy="256" r="215" fill="none"
          stroke="url(#goldGradient)" stroke-width="15"
          filter="url(#ringGlow)"/>

  <!-- High-fidelity exact vector path for Om (ॐ) matching reference image -->
  <g id="om-vector" filter="url(#omGlow)">
    <!-- Top Diamond / Bindu -->
    <polygon points="280,108 304,132 280,156 256,132" fill="url(#goldGradient)"/>

    <!-- Crescent / Chandrakala -->
    <path d="M 215,130 C 235,166 280,188 338,158 C 352,150 358,160 348,170 C 298,220 230,195 212,138 C 210,132 212,128 215,130 Z"
          fill="url(#goldGradient)"/>

    <!-- Main Om glyph body -->
    <!-- Left 3-curve body + central loop + right tail swoop -->
    <path fill-rule="evenodd" d="
      M 216,176
      C 245,176 270,194 266,228
      C 263,254 240,270 220,276
      C 205,280 205,286 218,290
      C 248,298 274,324 268,362
      C 260,404 220,432 170,432
      C 134,432 108,414 116,370
      C 120,346 122,318 116,252
      C 114,244 122,242 126,248
      C 142,274 156,336 142,374
      C 136,390 148,400 168,400
      C 200,400 232,378 236,346
      C 242,306 208,284 182,284
      C 174,284 172,274 178,272
      C 202,264 234,248 236,218
      C 238,196 222,184 202,184
      C 176,184 156,200 140,224
      C 134,232 126,228 128,218
      C 140,190 174,176 216,176 Z

      M 242,280
      C 278,252 316,200 376,200
      C 424,200 450,238 450,284
      C 450,332 418,368 376,368
      C 344,368 322,348 322,324
      C 322,298 344,280 370,280
      C 386,280 398,290 398,306
      C 398,322 386,332 374,332
      C 366,332 362,328 362,322
      C 362,314 370,310 374,310
      C 376,310 378,312 378,314
      C 378,320 372,324 366,324
      C 358,324 352,316 352,304
      C 352,282 370,264 394,264
      C 420,264 432,286 432,310
      C 432,338 410,358 378,358
      C 334,358 300,326 294,286
      C 292,272 284,272 278,278
      L 242,280 Z
    " fill="url(#goldGradient)"/>
  </g>
</svg>
