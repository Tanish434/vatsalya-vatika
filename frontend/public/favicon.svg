<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGF" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2a1a08"/>
      <stop offset="70%"  stop-color="#140e06"/>
      <stop offset="100%" stop-color="#0a0804"/>
    </radialGradient>
    <linearGradient id="goldGF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFF8D6"/>
      <stop offset="20%"  stop-color="#FFD966"/>
      <stop offset="50%"  stop-color="#F59E0B"/>
      <stop offset="80%"  stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <clipPath id="circleClipF">
      <circle cx="256" cy="256" r="228"/>
    </clipPath>
    <filter id="glowF" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowF" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8"  flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="250" fill="url(#bgGF)"/>
  <circle cx="256" cy="256" r="242" fill="none" stroke="url(#goldGF)" stroke-width="10"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#goldGF)" stroke-width="2.5" opacity="0.7" stroke-dasharray="10 5"/>
  <circle cx="256" cy="256" r="242" fill="none" stroke="#F59E0B" stroke-width="6" opacity="0.2" filter="url(#glowF)"/>

  <g clip-path="url(#circleClipF)" filter="url(#shadowF)">
    <text
      x="256"
      y="310"
      font-family="'Noto Sans Devanagari','Nirmala UI','Mangal','Segoe UI',sans-serif"
      font-size="220"
      font-weight="900"
      fill="url(#goldGF)"
      text-anchor="middle"
      dominant-baseline="auto"
    >ॐ</text>
  </g>
</svg>
