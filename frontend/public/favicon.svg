<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradFav" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24190c"/>
      <stop offset="60%" stop-color="#14100b"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </radialGradient>
    <linearGradient id="goldGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="goldGlowFav" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="omShadowFav" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="250" fill="url(#bgGradFav)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.3" filter="url(#goldGlowFav)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGradFav)" stroke-width="12" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#goldGradFav)" stroke-width="3" opacity="0.85" stroke-dasharray="8 4" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGradFav)" stroke-width="2" opacity="0.6" />

  <g filter="url(#omShadowFav)" transform="translate(0, 10)">
    <text 
      x="256" 
      y="335" 
      font-family="'Noto Sans Devanagari', 'Nirmala UI', 'Yatra One', 'Segoe UI', sans-serif" 
      font-size="270" 
      font-weight="900" 
      fill="url(#goldGradFav)" 
      stroke="#78350F"
      stroke-width="2"
      text-anchor="middle"
      letter-spacing="0">ॐ</text>
  </g>
</svg>
