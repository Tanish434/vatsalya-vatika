<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="55%" r="60%">
      <stop offset="0%"   stop-color="#1f1408"/>
      <stop offset="50%"  stop-color="#120d05"/>
      <stop offset="100%" stop-color="#090603"/>
    </radialGradient>
    <linearGradient id="gold2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#FFF5B0"/>
      <stop offset="30%"  stop-color="#FFCC33"/>
      <stop offset="60%"  stop-color="#E08B00"/>
      <stop offset="100%" stop-color="#7A4500"/>
    </linearGradient>
    <clipPath id="safeClip2">
      <circle cx="256" cy="256" r="185"/>
    </clipPath>
    <filter id="ringFx2" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="omFx2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#FFAA00" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bg2)"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#gold2)" stroke-width="11" filter="url(#ringFx2)"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#gold2)" stroke-width="2.5" opacity="0.6"/>

  <g clip-path="url(#safeClip2)" filter="url(#omFx2)">
    <text
      x="256"
      y="275"
      font-family="'Noto Sans Devanagari','Mangal','Nirmala UI','Arial Unicode MS',sans-serif"
      font-size="120"
      font-weight="900"
      fill="url(#gold2)"
      text-anchor="middle"
    >ॐ</text>
  </g>
</svg>
